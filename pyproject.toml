[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp"
version = "0.1.0"
description = "Streaming ML predictor of schedule deviations for urban transport (NDTP telemetry)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "networkx>=3.2",
    "leuvenmapmatching>=1.1",
    "catboost>=1.2.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# BLE001 (blind except) is the deliberate degradation strategy of the stream pipeline
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["BLE001", "E501", "RUF001", "RUF002", "RUF003", "E712", "E402"]

[tool.ruff.lint.per-file-ignores]
# binary protocol headers are unpacked positionally by design
"src/mtp/ndtp.py" = ["RUF059"]
